<style>
  :root{
    --bg:#FFF8EF; --card:#FFFFFF; --ink:#2B2640; --ink-soft:#847D98;
    --coral:#FF6F5E; --coral-deep:#E85A49; --teal:#3FC1B0; --teal-deep:#2A9D8F;
    --yellow:#FFC94D; --veg:#4CAF7D; --veg-bg:#E4F5EB; --nonveg-deep:#D9503F; --nonveg-bg:#FFEAE6;
    --period:#B784DD; --period-bg:#F3E8FC; --line:#F0E4D3; --shadow: 0 4px 14px rgba(43,38,64,0.07);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .app{max-width:780px;margin:0 auto;padding:26px 18px 90px;}
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px;}
  .brand{font-family:'Fredoka',sans-serif;font-weight:700;font-size:30px;color:var(--coral-deep);}
  .datebadge{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;background:var(--card);padding:5px 10px;border-radius:20px;box-shadow:var(--shadow);}
  .sub{font-size:13px;color:var(--ink-soft);margin-bottom:20px;}
  .ramp{background:var(--card);border-radius:20px;padding:16px 18px 14px;margin-bottom:18px;box-shadow:var(--shadow);}
  .ramp-label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--teal-deep);margin-bottom:10px;font-weight:700;}
  .ramp-track{position:relative;height:44px;}
  .ramp-line{position:absolute;left:2%;right:2%;top:26px;height:3px;background:var(--line);border-radius:3px;}
  .ramp-line-fill{position:absolute;left:2%;top:26px;height:3px;background:linear-gradient(90deg,var(--yellow),var(--teal));border-radius:3px;}
  .ramp-dot{position:absolute;top:14px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft);transition:all .2s;}
  .ramp-dot.done{background:var(--teal);border-color:var(--teal);color:#fff;}
  .ramp-dot.today{border-color:var(--coral);border-width:3px;background:#fff;color:var(--coral-deep);font-weight:700;width:28px;height:28px;top:12px;margin-left:-14px;}
  .ramp-caption{font-size:12px;color:var(--ink-soft);margin-top:8px;}
  .ramp-caption b{color:var(--ink);}
  .banner{border-radius:18px;padding:14px 18px;margin-bottom:18px;box-shadow:var(--shadow);}
  .banner.period{background:var(--period-bg);}
  .banner.prep{background:#FFF3D6;}
  .banner .lbl{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;font-weight:700;margin-bottom:6px;}
  .banner.period .lbl{color:var(--period);}
  .banner.prep .lbl{color:#B8860B;}
  .banner .txt{font-size:13.5px;color:var(--ink);}
  .tabs{display:flex;gap:4px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;}
  .tab{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;padding:9px 14px;background:var(--card);border:none;border-radius:20px;cursor:pointer;color:var(--ink-soft);white-space:nowrap;box-shadow:var(--shadow);}
  .tab.active{color:#fff;background:var(--coral);}
  .card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);}
  .card h2{font-family:'Fredoka',sans-serif;font-size:19px;font-weight:600;margin:0 0 4px;}
  .card .meta{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:4px 10px;border-radius:20px;margin-right:6px;}
  .tag.veg{background:var(--veg-bg);color:var(--veg);}
  .tag.nonveg{background:var(--nonveg-bg);color:var(--nonveg-deep);}
  .tag.rest{background:#EFEAF7;color:#8577AD;}
  .tag.period{background:var(--period-bg);color:var(--period);}
  .simplecheck{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .simplecheck:last-child{border-bottom:none;}
  .check{width:22px;height:22px;flex:0 0 22px;border-radius:8px;border:2px solid var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;background:var(--card);}
  .check.on{background:var(--teal);border-color:var(--teal);}

  .item-text{font-size:14.5px;line-height:1.4;}
  .item-time{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);margin-left:8px;}
  .item-text.struck{color:var(--ink-soft);text-decoration:line-through;}
  .meal-block{border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;}
  .meal-block:last-child{margin-bottom:0;}
  .meal-head{display:flex;align-items:flex-start;gap:12px;cursor:pointer;}
  .meal-head .item-text{flex:1;}
  .meal-caret{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .meal-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}

  .optchip{font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:20px;border:2px solid var(--line);background:var(--bg);color:var(--ink-soft);cursor:pointer;}
  .optchip.sel{border-color:var(--teal);background:var(--teal);color:#fff;}
  .opt-content{font-size:13.5px;line-height:1.6;}
  .water-row{display:flex;align-items:center;gap:16px;}
  .water-glasses{display:flex;flex-wrap:wrap;gap:8px;flex:1;}
  .glass{width:30px;height:34px;border-radius:6px 6px 12px 12px;border:2px solid var(--teal);cursor:pointer;background:var(--card);transition:background .15s;}
  .glass.on{background:var(--teal);}

  .btn{font-family:'Inter',sans-serif;font-weight:700;font-size:13px;padding:10px 16px;border-radius:20px;border:none;background:var(--coral);color:#fff;cursor:pointer;}

  .btn.teal{background:var(--teal);}
  .btn.plum{background:var(--period);}
  .btn.small{padding:7px 13px;font-size:12px;}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .chip{font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:20px;border:2px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer;}
  .chip.sel{border-color:var(--coral);background:var(--coral);color:#fff;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:520px){.grid2{grid-template-columns:1fr;}}
  .stat{background:#FBF7EF;border-radius:14px;padding:12px 14px;}
  .stat .num{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--coral-deep);}
  .stat .lbl{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;}

  .divider{height:1px;background:var(--line);margin:14px 0;}

  .recipe-tap-hint{font-size:12px;color:var(--teal-deep);font-weight:600;margin-top:8px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(43,38,64,0.55);z-index:1000;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:600px){ .modal-overlay{align-items:center;} }
  .modal-box{background:var(--card);border-radius:24px 24px 0 0;max-width:600px;width:100%;max-height:88vh;overflow-y:auto;padding:24px 22px 30px;position:relative;}
  @media(min-width:600px){ .modal-box{border-radius:24px;} }
  .modal-close{position:sticky;top:0;float:right;width:32px;height:32px;border-radius:50%;background:#F3EEE3;border:none;font-size:16px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:-32px;}

  .modal-section-title{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;color:var(--teal-deep);margin:18px 0 8px;}
  .modal-ing-item{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line);}
  .modal-ing-item:last-child{border-bottom:none;}
  .modal-step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .modal-step:last-child{border-bottom:none;}
  .modal-step-num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .modal-step-text{font-size:14px;line-height:1.5;padding-top:2px;}
</style>

<script>
// Fallback storage: if window.storage (Claude's built-in storage) isn't present —
// e.g. when this file is opened directly in Safari / added to Home Screen —
// use the phone's local storage instead, so your data still saves.
if (typeof window.storage === 'undefined') {
  window.storage = {
    get: async (key) => {
      const v = localStorage.getItem('logbook:'+key);
      if (v === null) throw new Error('not found');
      return { key, value: v, shared: false };
    },
    set: async (key, value) => {
      localStorage.setItem('logbook:'+key, value);
      return { key, value, shared: false };
    },
    delete: async (key) => {
      localStorage.removeItem('logbook:'+key);
      return { key, deleted: true, shared: false };
    },
    list: async (prefix) => {
      const all = Object.keys(localStorage).filter(k => k.startsWith('logbook:'));
      const keys = all.filter(k => !prefix || k.startsWith('logbook:'+prefix)).map(k => k.replace('logbook:',''));
      return { keys };
    }
  };
}
</script>

function ymd(d){return d.toISOString().slice(0,10);}
function dateOnly(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function fmtTime(hours){
  let h=((hours%24)+24)%24;
  let hh=Math.floor(h); let mm=Math.round((h-hh)*60);
  if(mm===60){mm=0;hh+=1;hh=hh%24;}
  const ampm = hh>=12 ? 'PM':'AM';
  let disp = hh%12; if(disp===0) disp=12;
  return disp+':'+String(mm).padStart(2,'0')+' '+ampm;
}
function timeStrToHours(t){ if(!t) return null; const parts=t.split(':').map(Number); return parts[0]+parts[1]/60; }

function cycleInfo(now, cycle){
  if(!cycle || !cycle.lastStart) return {active:false, periodDay:null, phase:null};
  const last = new Date(cycle.lastStart+'T00:00:00');
  const avg = cycle.avgLength || 28;
  const diffDays = Math.floor((dateOnly(now)-dateOnly(last))/86400000);
  if(diffDays<0) return {active:false, periodDay:null, phase:null};
  const cyclePos = ((diffDays % avg)+avg)%avg;
  if(cyclePos < 5){ const periodDay = cyclePos+1; const phase = periodDay<=3 ? 'rest' : 'light'; return {active:true, periodDay, phase}; }
  return {active:false, periodDay:null, phase:null};
}
function prepCycleInfo(now, anchor){
  const anchorDate = anchor ? new Date(anchor+'T00:00:00') : START;
  const diff = Math.floor((dateOnly(now)-dateOnly(anchorDate))/86400000);
  const pos = ((diff%3)+3)%3;
  return {pos, isPrepDay: pos===0};
}
function sleepTargetsFor(date){
  const daysSince = Math.max(0, Math.floor((dateOnly(date)-START)/86400000));
  const steps = Math.floor(daysSince/2);
  const targetBed = Math.max(22.5, 28.5 - steps*(20/60));
  const targetWake = Math.max(6.5, 12.5 - steps*(20/60));
  return {targetBed, targetWake, bedStr:fmtTime(targetBed), wakeStr:fmtTime(targetWake)};
}

function dayInfo(date, cycle, prepAnchor, yesterdayFeedback, yesterdayExtraCal){
  const daysSince = Math.floor((dateOnly(date) - START) / 86400000);
  const dow = date.getDay();
  const base = DAY_TYPES[dow];
  const easing = daysSince>=0 && daysSince<7;
  const easeDay = easing ? daysSince+1 : null;
  let calTarget, waterTarget;
  if(easing){ calTarget = Math.round(1750 - (easeDay-1)*(150/6)); waterTarget = Math.round((2000 + (easeDay-1)*(800/6))/50)*50; }
  else if(daysSince<0){ calTarget = 1750; waterTarget = 2000; }
  else { calTarget = 1550; waterTarget = 3000; }
  const period = cycleInfo(date, cycle);
  let workoutLabel = base.workoutLabel;
  let calNote = '';
  if(period.active){
    if(period.phase==='rest'){ workoutLabel = 'Rest — period day '+period.periodDay+' of 5, no exercise scheduled'; calTarget += 150; calNote='Nudged up for period days.'; }
    else { workoutLabel = 'Light movement only — period day '+period.periodDay+' of 5'; calTarget += 100; calNote='Nudged up for period days.'; }
  }
  const extra = yesterdayExtraCal||0;
  if(extra >= 600){ calTarget -= 150; calNote='Nudged down gently after a bigger extra yesterday.'; }
  else if(extra >= 250){ calTarget -= 75; calNote='Nudged down gently after some extra calories yesterday.'; }
  else if(yesterdayFeedback==='Cheat day'){ calTarget -= 150; calNote='Nudged down gently after yesterday.'; }
  else if(yesterdayFeedback==='Cheat meal'){ calTarget -= 100; calNote='Nudged down gently after yesterday.'; }
  else if(yesterdayFeedback==='Ate a bit extra'){ calTarget -= 75; calNote='Nudged down gently after yesterday.'; }
  const prep = prepCycleInfo(date, prepAnchor);
  return {...base, workoutLabel, dow, daysSince, easing, easeDay: easeDay||1, calTarget, waterTarget, notStarted: daysSince<0, period, prep, calNote};
}

async function callClaudeJSON(system, user){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: system,
      messages: [{ role: "user", content: user }]
    })
  });
  const data = await response.json();
  const text = (data.content||[]).map(b=>b.text||'').join('\n');
  const clean = text.replace(/```json|```/g,'').trim();
  return JSON.parse(clean);
}

function rampStrip(info){
  const days = [1,2,3,4,5,6,7];
  const activeIdx = info.easing ? info.easeDay : (info.notStarted?0:7);
  const fillPct = info.easing ? ((info.easeDay-1)/6*96)+2 : (info.notStarted? 2 : 98);
  let dots = days.map(d=>{
    const cls = d < activeIdx ? 'done' : (d===activeIdx && info.easing ? 'today' : '');
    const leftPct = 2 + (d-1)*(96/6);
    return `<div class="ramp-dot ${cls}" style="left:${leftPct}%">${d}</div>`;
  }).join('');
  const startLabel = START.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  const caption = info.notStarted ? `Starts <b>tomorrow, ${startLabel}</b> — first week eases in gently.` : info.easing ? `Easing-in week — <b>day ${info.easeDay} of 7</b>.` : `Full routine — easing-in week complete. Steady as she goes!`;
  return `<div class="ramp"><div class="ramp-label">Week 1 accommodation ramp</div><div class="ramp-track"><div class="ramp-line"></div><div class="ramp-line-fill" style="width:${fillPct}%"></div>${dots}</div><div class="ramp-caption">${caption}</div></div>`;
}

    </div>
    <div class="card">
      <h2>Workout — ${info.workoutLabel}</h2>
      <div class="meta">${info.period.active ? (info.period.phase==='rest'?'Rest day':'Light day') : (info.easing?'Easing-in version':'Full version')}</div>
      <ul class="exercise-list">${wSet.map(x=>`<li>${x}</li>`).join('')}</ul>
    </div>
    <div class="card">
      <h2>Morning wellness drink <span style="font-size:11px;color:var(--ink-soft);font-weight:400;">(optional)</span></h2>
      <b>${drink.name}</b>

function renderSleep(now){

    const s=timeStrToHours(e.sleep), w=timeStrToHours(e.wake);

    return `<div class="logrow"><span class="d">${e.date}</span><span>Slept ${e.sleep||'—'} → Woke ${e.wake||'—'} (${dur}h)</span></div>`;

async function renderProgressAsync(content){
  const dates = [];
  for(let i=0;i<14;i++){ dates.push(ymd(new Date(Date.now()-i*86400000))); }
  let rows = [];
  for(const d of dates){
    try{
      const r = await window.storage.get('daily-state:'+d);
      if(r){
        const v = JSON.parse(r.value);
        const total = 10;
        const done = v.checklist ? Object.values(v.checklist).filter(Boolean).length : 0;
        rows.push({date:d, done, total, water:v.water||0, feedback: v.feedback?v.feedback.status:null});
      }
    }catch(e){}
  }
  const lastWeight = state.weightLog.length ? state.weightLog[state.weightLog.length-1] : null;
  const daysSinceWeight = lastWeight ? Math.floor((Date.now()-new Date(lastWeight.date).getTime())/86400000) : 999;
  const sortedWeights = state.weightLog.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const weightRows = sortedWeights.map((w,idx,arr)=>{
    const prev = arr[idx+1];
    const delta = prev ? (w.weight-prev.weight).toFixed(1) : null;
    return `<div class="logrow"><span class="d">${w.date}</span><span>${w.weight} kg ${delta!==null?`(${delta>0?'+':''}${delta})`:''}</span></div>`;
  }).join('') || '<div class="meta">No weight entries yet.</div>';
  const dayRows = rows.map(r=>`<div class="logrow"><span class="d">${r.date}</span><span>${r.done}/${r.total} tasks · ${r.water*250}ml water ${r.feedback?'· '+r.feedback:''}</span></div>`).join('') || '<div class="meta">No history yet.</div>';

  content.innerHTML = `
    <div class="card">
      <h2>Weekly weigh-in</h2>
      <div class="meta">${daysSinceWeight>=7 ? "It's been a week or more — time for a check-in!" : "Logged "+daysSinceWeight+" day(s) ago."}</div>
      <div class="grid2">
        <div><label class="f">Date</label><input class="f" type="date" id="weight-date" value="${ymd(new Date())}"></div>
        <div><label class="f">Weight (kg)</label><input class="f" type="number" step="0.1" id="weight-val" placeholder="e.g. 71.5"></div>
      </div>
      <button class="btn teal small" id="save-weight">Save weight</button>
    </div>
    <div class="card"><h2>Weight history</h2>${weightRows}</div>
    <div class="card"><h2>Day-by-day log (last 14 days)</h2>${dayRows}</div>
  `;
  const saveWeightBtn = document.getElementById('save-weight');
  if(saveWeightBtn) saveWeightBtn.onclick = async ()=>{
    const d = document.getElementById('weight-date').value;
    const v = parseFloat(document.getElementById('weight-val').value);
    if(d && !isNaN(v)){ state.weightLog.push({date:d, weight:v}); await saveWeightLog(); render(); }
  };
}

function wireEvents(info, todayKey, now){
  document.querySelectorAll('.check[data-id]').forEach(el=>{ el.onclick = async (e)=>{ e.stopPropagation(); const id = el.dataset.id; state.checklist[id] = !state.checklist[id]; await saveDaily(); render(); }; });
  document.querySelectorAll('[data-mealtoggle]').forEach(el=>{ el.onclick = (e)=>{ if(e.target.classList.contains('check')) return; const slot = el.dataset.mealtoggle; mealUI[slot].open = !mealUI[slot].open; render(); }; });
  document.querySelectorAll('.optchip[data-slot]').forEach(el=>{ el.onclick = ()=>{ const slot = el.dataset.slot; const opt = el.dataset.opt; mealUI[slot].sel = opt; render(); }; });
  document.querySelectorAll('.glass').forEach(el=>{ el.onclick = async ()=>{ const g = parseInt(el.dataset.g); const cur = state.water[todayKey]||0; state.water[todayKey] = (g===cur) ? g-1 : g; await saveDaily(); render(); }; });
  document.querySelectorAll('.check[data-shop]').forEach(el=>{ el.onclick = async ()=>{ const key = el.dataset.shop; state.shopping[key] = !state.shopping[key]; await saveShopping(); render(); }; });

  const saveCycleBtn = document.getElementById('save-cycle'); if(saveCycleBtn) saveCycleBtn.onclick = async ()=>{ const dateVal = document.getElementById('cycle-date').value; const lenVal = parseInt(document.getElementById('cycle-length').value)||28; state.cycle = {lastStart: dateVal||null, avgLength: lenVal}; await saveCycle(); render(); };
  const periodTodayBtn = document.getElementById('period-today'); if(periodTodayBtn) periodTodayBtn.onclick = async ()=>{ const today = ymd(new Date()); state.cycle = {...state.cycle, lastStart: today}; await saveCycle(); render(); };
  document.querySelectorAll('.chip[data-fb]').forEach(el=>{
    el.onclick = ()=>{ const status = el.dataset.fb; const noteEl = document.getElementById('fb-note'); const note = noteEl ? noteEl.value : ''; state.feedback[todayKey] = {status, note}; document.querySelectorAll('.chip[data-fb]').forEach(c=>c.classList.toggle('sel', c.dataset.fb===status)); };
  });
  const saveFbBtn = document.getElementById('save-fb'); if(saveFbBtn) saveFbBtn.onclick = async ()=>{ const note = document.getElementById('fb-note').value; if(!state.feedback[todayKey]) state.feedback[todayKey] = {status:'On track', note}; else state.feedback[todayKey].note = note; await saveDaily(); render(); };
  document.querySelectorAll('[data-amode]').forEach(el=>{ el.onclick = ()=>{ assistantUI.mode = el.dataset.amode; render(); }; });
  const logImageInput = document.getElementById('log-image-input');
  if(logImageInput) logImageInput.onchange = async (e)=>{
    const file = e.target.files[0];
    if(file){
      try{
        const base64 = await fileToBase64(file);
        assistantUI.logImageBase64 = base64;
        assistantUI.logImageMediaType = file.type;
        assistantUI.logImageName = file.name;
        render();
      }catch(err){ assistantUI.logError = "Couldn't read that photo — try another one."; render(); }
    }
  };
  const logImageRemove = document.getElementById('log-image-remove');
  if(logImageRemove) logImageRemove.onclick = ()=>{ assistantUI.logImageBase64=null; assistantUI.logImageMediaType=null; assistantUI.logImageName=null; render(); };
  const askSendBtn = document.getElementById('ask-send');
  if(askSendBtn) askSendBtn.onclick = async ()=>{
    const q = document.getElementById('ask-input').value.trim();
    if(!q) return;
    assistantUI.question = q; assistantUI.loading = true; assistantUI.error = null; render();
    try{
      const system = `You are a supportive, practical diet assistant helping someone with a weight-loss goal. Today they have roughly ${info.calTarget} kcal as their overall target, diet type is ${info.diet}, and it's ${info.name}${info.period.active ? ' (currently on a period, day '+info.period.periodDay+' of 5)':''}. Give a short, warm, practical recommendation for what to eat or order given what they're asking about, favoring the healthiest reasonable version of what they want. Always include a specific calorie ceiling number for this one meal so the rest of the day still stays on track. Respond ONLY with strict JSON, no markdown, no extra text: {"recommendation": "1-3 sentences", "calorieCeiling": number, "note": "short encouraging note"}`;
      const result = await callClaudeJSON(system, q);
      assistantUI.response = result;
    }catch(e){ assistantUI.error = "Couldn't reach the assistant just now — try again in a moment."; }
    assistantUI.loading = false; render();
  };
  const logSendBtn = document.getElementById('log-send');
  if(logSendBtn) logSendBtn.onclick = async ()=>{
    const desc = document.getElementById('log-input').value.trim();
    const hasImage = !!assistantUI.logImageBase64;
    if(!desc && !hasImage) return;
    assistantUI.logDesc = desc; assistantUI.logLoading = true; assistantUI.logError = null; render();
    try{
      const remainingNow = info.calTarget - extraLogTotal(todayKey);
      const system = `You are a supportive diet assistant. The user has roughly ${remainingNow} kcal left today out of a ${info.calTarget} kcal target, and wants to eat a packaged or instant food (like ramen, chips, or a packaged snack) as an occasional craving. They've described it and/or attached a photo of the nutrition/energy label — read any calorie or serving info visible in the image if present. Give a clear, kind verdict on whether it reasonably fits into today, and if they eat it, specific practical adjustments for the rest of today's meals and checklist (e.g. lighten dinner, skip the snack, add extra water) so the day still balances out. This is an occasional treat, not a failure — keep the tone supportive, not scolding. Respond ONLY with strict JSON, no markdown, no extra text: {"summary": "product name or short description", "estimatedCalories": number, "verdict": "1 sentence — can they fit this in today or not", "adjustment": "1-2 sentence practical adjustment for the rest of today"}`;
      let userContent;
      if(hasImage){
        userContent = [
          { type: "image", source: { type:"base64", media_type: assistantUI.logImageMediaType, data: assistantUI.logImageBase64 } },
          { type: "text", text: desc || "Here's the nutrition/energy label — please read it and estimate calories for a typical serving." }
        ];
      } else {
        userContent = desc;
      }
      const result = await callClaudeJSON(system, userContent);
      const list = state.extraLog[todayKey] || [];
      list.push({desc: result.summary, calories: result.estimatedCalories});
      state.extraLog[todayKey] = list;
      state.todayAdjustment[todayKey] = result.adjustment;
      await saveDaily();
      assistantUI.logResult = result; assistantUI.logDesc = '';
      assistantUI.logImageBase64=null; assistantUI.logImageMediaType=null; assistantUI.logImageName=null;
    }catch(e){ assistantUI.logError = "Couldn't read/estimate that just now — try again in a moment."; }
    assistantUI.logLoading = false; render();
  };
  const refreshRecipesBtn = document.getElementById('refresh-recipes'); if(refreshRecipesBtn) refreshRecipesBtn.onclick = async ()=>{
    const current = currentRecipeSetIndex(now);
    state.recipeSetOverride = (current+1)%RECIPE_SETS.length;
    await saveRecipeOverride(); render();
  };
  const resetRecipesBtn = document.getElementById('reset-recipes'); if(resetRecipesBtn) resetRecipesBtn.onclick = async ()=>{
    state.recipeSetOverride = null; await saveRecipeOverride(); render();
  };
  const saveSleepBtn = document.getElementById('save-sleep'); if(saveSleepBtn) saveSleepBtn.onclick = async ()=>{
    const d = document.getElementById('sleep-date').value; const s = document.getElementById('sleep-time').value; const w = document.getElementById('wake-time').value;
    if(d){ state.sleepLog = state.sleepLog.filter(e=>e.date!==d); state.sleepLog.push({date:d, sleep:s, wake:w}); await saveSleepLog(); render(); }
  };
}

(async function init(){ await loadState(); render(); })();
</script>
</body>
</html>
